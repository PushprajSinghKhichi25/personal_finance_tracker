spring:
  application:
    name: personal-finance-tracker
  datasource:
    url: jdbc:mysql://localhost:3306/personal_finance_tracker
    username: root
    password: Psksql@2004
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /

jwt:
    secret: your-256-bit-secret-key-for-jwt-token-generation-and-validation-purpose-only-do-not-share-this-key-with-anyone-else-or-use-it-for-other-purposes-thank-you
    expiration: 86400000  # 24 hours in milliseconds
    refresh-expiration: 604800000  # 7 days in milliseconds

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG